services:

  s3:
    image: rustfs/rustfs:1.0.3
    hostname: s3
    container_name: s3
    depends_on:
      - volume-permission-helper
    restart: unless-stopped
    networks:
      - s3kit
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    volumes:
      - ${CONTAINER_DATA:-./data}/s3kit/rustfs/volume:/data0
      - ${CONTAINER_DATA:-./data}/s3kit/rustfs/logs:/app/logs
    environment:
      - RUSTFS_VOLUMES=/data0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=false # Disable strict disk topology checks.
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs

  # RustFS volume permissions fixer service
  volume-permission-helper:
    image: alpine
    volumes:
      - ${CONTAINER_DATA:-./data}/s3kit/rustfs/volume:/data0
      - ${CONTAINER_DATA:-./data}/s3kit/rustfs/logs:/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data0 /logs &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    # Permission baseline:
    # - default RustFS runtime user is 10001:10001
    # - alternatively, run rustfs service with host-matched `user: \"<uid>:<gid>\"`
    restart: "no"

networks:
  s3kit:
