services:

  s3:
    image: adobe/s3mock:5.2.3
    hostname: s3
    container_name: s3
    restart: unless-stopped
    networks:
      - s3kit
    ports:
      - "9000:9000"
    volumes:
      - ${CONTAINER_DATA:-./data}/s3kit/s3mock:/s3mockroot
    environment:
      - COM_ADOBE_TESTING_S3MOCK_HTTP_PORT=9000
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/s3mockroot
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true

networks:
  s3kit:
